<!doctype html><html lang="tr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>KaçNet</title>
<style>
body{margin:0;background:#F8F1E5;color:#2a2620;font:16px/1.6 -apple-system,'Segoe UI',Roboto,sans-serif;
display:grid;place-items:center;min-height:100vh;text-align:center;padding:24px}
a{color:#2a2620;font-weight:700}
.b{width:20px;height:20px;border:2.5px solid #2a2620;border-radius:50%;display:inline-block;vertical-align:middle}
.b.dolu{background:#2a2620;width:23px;height:23px;border:none}
</style></head>
<body>
<div>
  <p><span class="b"></span> <span class="b dolu"></span> <span class="b"></span></p>
  <p><b>KaçNet</b>'e yönlendiriliyorsun…</p>
  <p id="el" hidden><a id="hedef" href="https://kacnet.app/">Açılmadıysa buraya dokun</a></p>
</div>
<script>
'use strict';
// Kimliksiz tıklama sayacı: yalnız kaynak etiketi + platform + zaman.
// Sayfa Instagram bio/story bağlantısı olarak kullanılır (?k=bio|story|reels).
var APP_STORE = 'https://apps.apple.com/tr/app/id6806163582';
var PLAY = 'https://play.google.com/store/apps/details?id=com.denizpeksuslu.kpss_app';
var PLAY_ACIK = false; // Play sayfası herkese açılınca true yapılacak.
var SITE = 'https://kacnet.app/';
var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkeWFram1ienJqYWtycmdtcWxyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyOTk1OTcsImV4cCI6MjEwMjg3NTU5N30.Zsx30mL4Tg0YS_qJWo-5qSheykQGfLNQFjDo2pVB_jY';

var ua = navigator.userAgent || '';
var ios = /iPhone|iPad|iPod/i.test(ua);
var android = /Android/i.test(ua);
var hedef = ios ? APP_STORE : (android && PLAY_ACIK ? PLAY : SITE);
var kaynak = (new URLSearchParams(location.search).get('k') || 'bio').slice(0, 24);
var platform = ios ? 'ios' : (android ? 'android' : 'diger');

document.getElementById('hedef').href = hedef;
setTimeout(function(){ document.getElementById('el').hidden = false; }, 1500);

fetch('https://kdyakjmbzrjakrrgmqlr.supabase.co/rest/v1/tiklamalar', {
  method: 'POST', keepalive: true,
  headers: {apikey: ANON, Authorization: 'Bearer ' + ANON,
            'Content-Type': 'application/json', Prefer: 'return=minimal'},
  body: JSON.stringify({kaynak: kaynak, platform: platform})
}).catch(function(){}).finally(function(){ location.replace(hedef); });
setTimeout(function(){ location.replace(hedef); }, 1200); // sayaç gecikirse bekletme
</script>
</body></html>
